name: school_event_attendance
description: "School Event Registration and QR-Based Attendance Management System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Networking & Storage
  http: ^1.2.0
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # QR Code Scanning & Generation
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.0

  # UI & Utilities
  intl: ^0.20.3
  cached_network_image: ^3.3.1
  image_picker: ^1.0.7
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.3.0
  shadcn_ui: ^0.57.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
