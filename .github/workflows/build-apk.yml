name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'
          cache: true

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Verify Flutter Installation
        run: flutter doctor -v

      - name: Install Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build Release APK
        working-directory: mobile
        run: |
          flutter build apk --release --verbose --dart-define=API_BASE_URL=https://attendify-fugh.onrender.com/api/v1

      - name: Rename APK
        working-directory: mobile
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/attendify-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: attendify-android-apk
          path: mobile/build/app/outputs/flutter-apk/attendify-release.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.1.0
          name: Attendify v1.1.0 (Production Android APK)
          body: |
            ### Attendify Android Release v1.1.0
            - **Production Backend:** https://attendify-fugh.onrender.com/api/v1
            - **Notification Sound:** SFXMint Ready Chime 07
            - Direct download for `attendify-release.apk`
          files: mobile/build/app/outputs/flutter-apk/attendify-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
